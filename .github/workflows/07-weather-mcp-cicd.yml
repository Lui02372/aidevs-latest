# 05_weather-mcp-deployment-project 전용 CI/CD
# 푸시·PR마다 테스트 → Compose 문법 검사 → 이미지 3개 빌드
# main 푸시(또는 수동 실행 시 deploy=true)면 AWS EC2로 배포 후 readiness 확인
name: 07 Weather MCP CI CD

on:
  push:
    paths:
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/backend/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/frontend/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/mcp_server/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/compose.yml"
      - ".github/workflows/07-weather-mcp-cicd.yml"
  pull_request:
    paths:
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/backend/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/frontend/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/mcp_server/**"
      - "aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project/compose.yml"
      - ".github/workflows/07-weather-mcp-cicd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy 05 application to AWS EC2"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weather-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: aidevs-main/aidevs-main/07_multi-agent-service-ops/00_runtime-and-deployment/05_weather-mcp-deployment-project

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/backend/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Test backend contract with Fake MCP and LLM
        working-directory: ${{ env.PROJECT_DIR }}/backend
        run: python -m pytest test_app.py -q
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build three images
        run: docker compose build

  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/weather-mcp-deployment'
          scp -r "$PROJECT_DIR"/. "$AWS_USER@$AWS_HOST:~/weather-mcp-deployment/"
      - name: Deploy and verify readiness
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/weather-mcp-deployment && test -f .env && docker compose config --quiet && docker compose up -d --build && curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:8000/health/ready'
