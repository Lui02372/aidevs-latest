name: simple-multi-llm-app

# 기본 수업용 구성입니다. 이미 실행 중인 PostgreSQL·Redis·Ollama를 재사용하고
# 이 프로젝트의 Frontend와 Backend Container만 생성합니다.
services:
  backend:
    # Docker Hub에 배포할 때도 같은 이름으로 태그할 수 있도록 image를 함께 지정합니다.
    image: ${DOCKERHUB_USERNAME:-local}/simple-multi-llm-backend:${IMAGE_TAG:-latest}
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/simple-multi-llm-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
