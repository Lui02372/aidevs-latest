# [학습] Compose 프로젝트 이름이다. 생성되는 리소스를 다른 프로젝트와 구분한다.
name: simple-multi-llm-full-stack

# [학습] 아래 키는 서비스 이름이다. 같은 Compose 네트워크에서 이름으로 서로 찾는다.
services:
  redis:
    # [학습] Redis 7 계열 Alpine 이미지를 사용한다. backend와 같은 네트워크에서 내부 6379번으로 연결한다.
    image: redis:7-alpine
    # [학습] Redis 서버의 AOF 기록을 켜 저장 명령을 파일로 유지하게 한다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # [학습] 이름 있는 볼륨 redis_data를 데이터 폴더에 붙여 컨테이너 교체와 데이터를 분리한다.
      - redis_data:/data
    # [학습] Docker가 아래 명령의 성공 여부로 컨테이너 건강 상태를 판정한다.
    healthcheck:
      # [학습] Redis의 PING 응답을 확인하는 명령이다.
      test: ["CMD", "redis-cli", "ping"]
      # [학습] interval은 검사 간격, timeout은 한 검사 제한 시간, retries는 unhealthy 판정 전 연속 실패 횟수다.
      interval: 5s
      timeout: 3s
      retries: 10

  database:
    # [학습] PostgreSQL 17 계열 이미지를 사용한다. 이 구성은 DB 포트를 Host에 공개하지 않는다.
    image: postgres:17-alpine
    environment:
      # [학습] POSTGRES_USER·POSTGRES_PASSWORD·POSTGRES_DB는 새 DB 초기 생성 설정이다. 값은 문서에 복제하지 않는다.
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    volumes:
      # [학습] PostgreSQL 데이터를 이름 있는 볼륨에 보존한다.
      - postgres_data:/var/lib/postgresql/data
      # [학습] SQL 파일을 읽기 전용(ro)으로 연결한다. 이미지의 최초 빈 데이터 디렉터리 초기화 때 실행된다.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # [학습] Docker가 아래 명령의 성공 여부로 컨테이너 건강 상태를 판정한다.
    healthcheck:
      # [학습] CMD-SHELL로 DB 연결 수신 준비를 확인한다. 앱 테이블 존재 여부는 Backend가 별도 검사한다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-agent_db}"]
      # [학습] interval은 검사 간격, timeout은 한 검사 제한 시간, retries는 unhealthy 판정 전 연속 실패 횟수다.
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    # [학습] ollama 프로필을 선택했을 때만 이 서비스를 포함한다. Backend의 활성 플래그와는 별도 설정이다.
    profiles: ["ollama"]
    # [학습] Ollama 모델 서버 이미지다. latest는 고정 버전이 아니며 모델 파일은 별도로 준비한다.
    image: ollama/ollama:latest
    volumes:
      # [학습] 다운로드한 모델을 전용 볼륨에 보관한다. 이 서비스에는 healthcheck와 Host 포트 공개가 없다.
      - ollama_data:/root/.ollama

  backend:
    # [학습] 이 상대 폴더를 빌드 문맥으로 사용하고 그 안의 Dockerfile을 읽는다.
    build: ./backend
    environment:
      # [학습] Redis 접속 위치다. 기본·release는 Host 공용 서비스, full-stack은 내부 redis 서비스를 가리킨다.
      REDIS_URL: redis://redis:6379/0
      # [학습] PostgreSQL 접속 설정이다. 변수명과 연결 위치만 설명하며 실제 자격 증명은 기록하지 않는다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_user}:${POSTGRES_PASSWORD:-agent_pwd}@database:5432/${POSTGRES_DB:-agent_db}
      # [학습] OPENAI_API_KEY는 인증, OPENAI_MODEL은 모델 선택이다. ${변수:-기본값}은 미설정 또는 빈 값일 때 기본값을 쓴다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      # [학습] GEMINI_API_KEY와 GEMINI_MODEL은 Gemini 분기용이다. 설정 존재가 실제 API 성공을 뜻하지는 않는다.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # [학습] 활성 플래그·서버 주소·Llama/Gemma 모델명을 전달한다. 활성화만으로 모델 다운로드가 수행되지는 않는다.
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma3:4b}
    ports:
      # [학습] 왼쪽은 Host 공개 포트, 오른쪽은 Backend 컨테이너 내부 포트다.
      - "8000:8000"
    # [학습] 시작 시 아래 의존 서비스의 healthcheck 성공을 기다린다. 이후 장애를 계속 복구해 주는 코드는 아니다.
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    # [학습] Docker가 아래 명령의 성공 여부로 컨테이너 건강 상태를 판정한다.
    healthcheck:
      # [학습] 컨테이너 자기 자신의 준비 API를 검사하며 Redis·DB·스키마까지 확인한다. 모델 생성은 호출하지 않는다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      # [학습] interval은 검사 간격, timeout은 한 검사 제한 시간, retries는 unhealthy 판정 전 연속 실패 횟수다.
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    # [학습] 이 상대 폴더를 빌드 문맥으로 사용하고 그 안의 Dockerfile을 읽는다.
    build: ./frontend
    environment:
      # [학습] Streamlit 프로세스는 내부 서비스 이름 backend와 컨테이너 포트 8000으로 API를 호출한다.
      BACKEND_URL: http://backend:8000
    ports:
      # [학습] Host 8501번 요청을 Streamlit 내부 8501번으로 전달한다.
      - "8501:8501"
    # [학습] 시작 시 아래 의존 서비스의 healthcheck 성공을 기다린다. 이후 장애를 계속 복구해 주는 코드는 아니다.
    depends_on:
      backend:
        condition: service_healthy

# [학습] 위 서비스에서 참조한 세 이름 있는 볼륨을 프로젝트 리소스로 선언한다.
volumes:
  redis_data:
  postgres_data:
  ollama_data:
